name: Build Neon Debugger

on:
  push:
    branches: [neon-imgui-app]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: cmake -S figma-win-app -B figma-win-app/build -A x64

      - name: Build Release
        run: cmake --build figma-win-app/build --config Release --parallel

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = "$env:GITHUB_WORKSPACE\figma-win-app\build\Release\NeonDebugger.exe"
          if (!(Test-Path $exe -PathType Leaf)) { throw "Missing NeonDebugger.exe: $exe" }
          $size = (Get-Item $exe).Length
          Write-Host "Verified NeonDebugger.exe: $size bytes"
          if ($size -lt 100KB) { throw "Executable is unexpectedly small" }

      - name: Package EXE and ZIP
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\figma-win-app\build\Release\NeonDebugger.exe" "$env:GITHUB_WORKSPACE\dist\NeonDebugger.exe"
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\dist\NeonDebugger.exe" -DestinationPath "$env:GITHUB_WORKSPACE\NeonDebugger-Windows-x64.zip" -Force
          $entries = tar -tf "$env:GITHUB_WORKSPACE\NeonDebugger-Windows-x64.zip"
          $entries | Write-Host
          if ($entries -notcontains 'dist/NeonDebugger.exe' -and $entries -notcontains 'NeonDebugger.exe') { throw 'ZIP does not contain NeonDebugger.exe' }

      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: NeonDebugger.exe
          path: dist/NeonDebugger.exe
          if-no-files-found: error

      - name: Upload EXE ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NeonDebugger-Windows-x64
          path: NeonDebugger-Windows-x64.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/NeonDebugger.exe
            NeonDebugger-Windows-x64.zip
          fail_on_unmatched_files: true
