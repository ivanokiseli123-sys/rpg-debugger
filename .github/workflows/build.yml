name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path 'build\Release\NeonDebugger.exe')) { throw 'NeonDebugger.exe was not produced' }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonDebugger-Windows-x64
          path: build\Release\NeonDebugger.exe
          if-no-files-found: error

      - name: Create Release with direct EXE
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v0.0.{0}', github.run_number) }}
          name: NeonDebugger ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v0.0.{0}', github.run_number) }}
          files: build/Release/NeonDebugger.exe
          generate_release_notes: true
