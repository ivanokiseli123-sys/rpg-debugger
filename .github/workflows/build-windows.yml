name: Build NeonDebugger Windows EXE

on:
  push:
    branches: [neon-imgui-app]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S figma-win-app -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Prepare standalone EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/NeonDebugger.exe dist/NeonDebugger.exe
          if (-not (Test-Path dist/NeonDebugger.exe)) { throw 'NeonDebugger.exe was not produced' }
          Write-Host "Standalone EXE: $((Get-Item dist/NeonDebugger.exe).Length) bytes"

      - name: Upload standalone EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonDebugger-Windows-x64
          path: dist/NeonDebugger.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/NeonDebugger.exe
          fail_on_unmatched_files: true
