name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub Release with the Windows ZIP'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/NeonDebugger.exe dist/NeonDebugger.exe
          Compress-Archive -Path dist/NeonDebugger.exe -DestinationPath NeonDebugger-Windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonDebugger-Windows-x64
          path: NeonDebugger-Windows-x64.zip

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Neon Debugger v${{ github.run_number }}
          generate_release_notes: true
          files: NeonDebugger-Windows-x64.zip
