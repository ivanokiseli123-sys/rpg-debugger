name: Build NeonDebugger Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path build/Release/NeonDebugger.exe)) { throw 'NeonDebugger.exe was not produced.' }

      - name: Package standalone EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/NeonDebugger.exe dist/NeonDebugger.exe

      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: NeonDebugger-Windows-x64
          path: dist/NeonDebugger.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NeonDebugger.exe
